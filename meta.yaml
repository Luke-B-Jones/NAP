package:
  name: NAP
  version: "0.3.0"

source:
  git_url: https://github.com/Luke-B-Jones/NAP.git
  git_tag: v0.3.0 

build:
  number: 0
  script: bash build.sh

requirements:
  build:
    - python
    - blast

  run:
    - python=3.8
    - h5py
    - numpy
    - pandas
    - nanofilt
    - samtools
    - minimap2
    - vsearch
    - R
    - scripty
    - xterm
    - pysam
    - blast

about:
  home: https://github.com/yourusername/your_tool
  license: MIT
  summary: "Tool for processing Nanopore sequecning derived 16S and 18S mixed reads for microbiome studies"
  description: "Nanopore Amplicon Pipeline"

test:
  commands:
    - nap -v
